# 最初由 pnpm content:hant 從簡體版（copy.zh-hans.yaml）轉換，其後已人手改為香港用詞：事實內容用書面語，
# 介面文字帶少量粵語口語。Peter 於 2026-11-14 審閱並認可。
# from 記錄它對應的簡體文字；這份繁體由人手維護，腳本不會再覆蓋它。


nav:
  links:
    - { label: '~/關於', href: '#about' }
    - { label: '~/項目', href: '#projects' }
    - { label: '~/經歷', href: '#experience' }
    - { label: '~/聯絡', href: '#contact' }
  status: 在線 · {city}
  resume: 履歷（英文）
  say_hi: 打聲招呼
  logo_label: '{domain}——返回頂部'
  sections_label: 欄目
  hotbar:
    - 關於
    - 項目
    - 經歷
    - 聯絡
  hotbar_prefs: 設定

hero:
  headline:
    - 將[數據]
    - 砌成
    - 大家鍾意的東西[_]
  terminal_title: '{host}@{domain}: ~ — zsh'
  cmd_whoami: whoami
  cmd_interests: cat ~/interests.txt
  ok: '[OK]'
  summon: '/summon pixel_globe ~ ~ ~ {rotate:1b}'
  summon_ok: '已召喚 PixelGlobe。區塊已載入：36/36。{status}。'
  whoami_line: '{name} — {programme} @ {school}，{year} 屆。'
  cta_projects: 睇睇項目
  cta_resume: 下載英文履歷
  eyebrow_prefix: '// 玩家:'
  globe_label: 地球
  globe_value: '已轉動 {deg}°'
  avgeek_badge: AvGeek  ✈  航線 · 座位 · 里數
  avgeek_route: AvGeek  ✈  {from} ⇄ {to}
  globe_lat:
    n: 北緯 {deg}°
    s: 南緯 {deg}°
  globe_lon:
    e: 東經 {deg}°
    w: 西經 {deg}°
  globe_regions:
    north_america: 北美洲
    south_america: 南美洲
    europe: 歐洲
    africa: 非洲
    asia: 亞洲
    oceania: 大洋洲
    antarctica: 南極洲
    pacific: 太平洋
    atlantic: 大西洋
    indian: 印度洋
    arctic: 北冰洋
    southern: 南大洋
  copy_handle: 複製
  copy_label: 複製 {handle}
  copied: 已複製
  prompt:
    open: 在終端機輸入指令
    label: 指令
    hint: 輸入 help 睇指令。按 Esc 關閉。
    help:
      - help — 呢份清單
      - whoami — 我係邊個
      - ls — 本頁各個欄目
      - cat interests.txt — 我鍾意啲乜
      - open resume — 下載我的英文履歷
      - theme night | day | mono | paper | prism — 轉主題
      - clear — 清空畫面
      - exit — 關閉指令列
    not_found: 找不到指令：{cmd} —— 試下 help
    theme_set: 主題：{name}
    opening: 正在開啟 {name}…
  more: 更多 ▾
  less: 收起 ▴
  badges_label: 亮點

ticker:
  label: 狀態
  tags: { xp: XP, now: 而家, work: 工作, ping: PING, edu: 教育 }

about:
  cmd: cat ~/about.md
  title: [ '玩家屬性與', '已載入區塊' ]
  blurb: 我是誰、在讀什麼，以及沒有作品要趕的時候都在忙什麼。所有屬性均為自行申報，絕無出貓。
  whoami_title: 你好，我是 {first}（Zhicheng），修讀{major}理學士。
  card_whoami: whoami
  card_gpa: 績點 --等級
  card_now: 而家 --砌緊
  card_education: 教育經歷
  card_off: 收工 --之後
  card_avgeek: avgeek
  card_skills: 物品欄 --技能
  avgeek_title: 航線、座位、里數計劃。
  now_link: 在 App Store 開啟
  skills_basic: 基礎
  gpa_out_of: 滿分
  track_suffix: 方向
  minor_prefix: 副修
  coursework: 相關課程
  avgeek_panels:
    watching: 留意緊
    seat_rules: 揀位規則
    favorite_cabins: 心水艙位
    news: 航線消息
    fare_examples: 票價實驗室
    tools: 常用工具
  slot_tip: "{group} · 第 {n} 項，共 {count} 項"

projects:
  cmd: ls ~/projects --sort=shipping
  title: [ '已推出與', '進行中的作品' ]
  blurb: 我做過和正在做的東西。先睇精選作品，然後是物品欄裏的其他東西。
  featured: ★ 精選
  stack_label: '技術：'
  status_title: '~/projects'
  status_cmd: git status
  link_appstore: App Store
  link_repo: 原始碼
  link_live: 瀏覽網站
  next_label: 下一個 --區塊
  next_title: '???（載入中…）'
  next_body: 區塊尚未生成——多幾次提交之後再返嚟睇睇。
  next_tags: [ 待定 ]
  next_progress: 正在生成區塊 (-1, 3)…
  # 手機畫的是 App 自己的英文界面，所以這裏保持英文。
  phone:
    home_zone: America/Los_Angeles
    cities:
      - { code: FRA, name: Frankfurt, time_zone: Europe/Berlin }
      - { code: SEA, name: Seattle, time_zone: America/Los_Angeles }
      - { code: SHA, name: Shanghai, time_zone: Asia/Shanghai }
    weather: Open-Meteo
    hours: 24h
    tab_list: List
    tab_clock: Clock
    pick_label: 顯示此城市的時間：
  list_all: 全部列出 ▸
  position: 第 {n} 個，共 {count} 個

experience:
  cmd: git log --oneline --graph ~/career
  title:
    - 提交紀錄
  blurb: 我走過的路，最新的排最前。HEAD 指向接下來的事。
  head_hint: 打聲招呼 ↓
  head_dates: 而家 →
  community_cmd: git log --oneline ~/community
  community_title: 社區
  show_cmd: git show {hash}

contact:
  cmd: ping {host} --count 1
  title: [ '一齊', '砌啲嘢啦。' ]
  say_hi: 打聲招呼 · 電郵
  github: GITHUB
  linkedin: LINKEDIN
  resume: 英文履歷 PDF
  terminal_title: '~/contact — zsh'
  ping:
    request: 'PING {host} ({email}): 56 data bytes'
    reply: '64 bytes from {email}: icmp_seq=0 ttl=64 time=0.27 ms'
    summary: '--- 1 packet transmitted, 1 received, 0% packet loss ---'
  open_cmd: 'open mailto:{email}'
  emails_label: 或電郵至

footer:
  tagline: 由體素、咖啡和太多航班砌成
  prefs: 設定
  back_to_top: ▲ 返回重生點
  rights: 版權所有。
  updated: 更新於

prefs:
  open_label: 設定
  pause_label: 暫停動畫
  title: '~/.config — prefs'
  heading: 設定
  intro: 更改即時生效，並只儲存在此瀏覽器。
  close: 關閉
  reset_cmd: reset
  reset: 重設為預設值
  theme:
    cmd: theme --set
    legend: 主題
    options:
      night: { name: 夜間, note: 預設 }
      day: { name: 日間, note: 主世界 }
      mono-dark: { name: 黑白深色, note: 基岩 }
      mono-light: { name: 黑白淺色, note: 紙張 }
      cvd: { name: 色盲友善, note: 稜鏡 }
      auto: { name: 自動, note: '夜間或日間，跟隨裝置' }
    contrast_note: 你的裝置要求較高對比度，因此所有主題都會使用更醒目的線條和文字。
  motion:
    cmd: motion --set
    legend: 動態效果
    options:
      auto: { name: 自動, note: 跟隨裝置 }
      full: { name: 完整, note: 樣樣都會郁 }
      calm: { name: 平靜, note: '沒有開場動畫和火花，循環放慢' }
      off: { name: 關閉, note: 樣樣都唔郁 }
    reduced_note: 你的裝置要求減少動態效果，所以無論選哪一項，頁面都會保持靜止。
  text:
    cmd: text --size
    legend: 文字大小
    option: '{size}%'
  keys:
    cmd: keys --shortcuts
    legend: 鍵盤快捷鍵
    on: 開
    off: 關
    note: '不在輸入欄打字時，按「,」開啟此視窗，按「p」暫停動畫。'
  lang:
    cmd: lang --set
    legend: 語言
    note: 每種語言都是獨立頁面；點擊連結後仍會停留在原來位置。
    draft: 草稿

