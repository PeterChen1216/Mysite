prefs:
  open_label: 設置
  pause_label: 暫停動畫
  title: '~/.config — prefs'
  heading: 設置
  intro: 更改即時生效，並且只保存在此瀏覽器中。
  close: 關閉
  reset_cmd: reset
  reset: 恢復默認設置
  theme:
    cmd: theme --set
    legend: 主題
    options:
      night: { name: 夜間, note: 默認 }
      day: { name: 白天, note: 主世界 }
      mono-dark: { name: 黑白深色, note: 基岩 }
      mono-light: { name: 黑白淺色, note: 紙張 }
      cvd: { name: 色盲友好, note: 稜鏡 }
      auto: { name: 自動, note: '夜間或白天，跟隨設備' }
    contrast_note: 你的設備要求更高的對比度，所以每個主題都使用更醒目的線條和文字。
  motion:
    cmd: motion --set
    legend: 動效
    options:
      auto: { name: 自動, note: 跟隨設備 }
      full: { name: 完整, note: 一切都會動 }
      calm: { name: 平靜, note: '沒有開場和火花，循環放慢' }
      off: { name: 關閉, note: 一切靜止 }
