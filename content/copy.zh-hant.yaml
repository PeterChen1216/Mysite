  text:
    cmd: text --size
    legend: 文字大小
    option: '{size}%'
  keys:
    cmd: keys --shortcuts
    legend: 鍵盤快捷鍵
    on: 開
    off: 關
    note: '不在輸入框裏打字時，按“,”打開此窗口，按“p”暫停動畫。'
  lang:
