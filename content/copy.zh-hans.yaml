  stack_label: '技术栈：'
  status_title: '~/projects'
  status_cmd: git status
  link_appstore: App Store
  link_repo: 源代码
  link_live: 在线网站
  next_label: 下一个 --区块
  next_title: '???（加载中…）'
  next_body: 区块尚未生成——再过几次提交后回来看看。
  next_tags: [ 待定 ]
  next_progress: 正在生成区块 (-1, 3)…
  list_all: 全部列出 ▸
  position: '第 {n} 个，共 {count} 个'
