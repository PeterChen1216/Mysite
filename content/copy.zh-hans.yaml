  head_hint: 打个招呼 ↓
  head_dates: 现在 →
  show_cmd: 'git show {hash}'
  community_cmd: git log --oneline ~/community
  community_title: 社区

contact:
  cmd: ping {host} --count 1
  title: [ '一起来', '做点什么吧。' ]
  say_hi: 打个招呼 · 邮件
  github: GITHUB
  linkedin: LINKEDIN
  resume: 英文简历 PDF
  terminal_title: '~/contact — zsh'
