    south_america: 南美洲
    europe: 欧洲
    africa: 非洲
    asia: 亚洲
    oceania: 大洋洲
    antarctica: 南极洲
    pacific: 太平洋
    atlantic: 大西洋
    indian: 印度洋
    arctic: 北冰洋
