    request: 'PING {host} ({email}): 56 data bytes'
    reply: '64 bytes from {email}: icmp_seq=0 ttl=64 time=0.27 ms'
    summary: '--- 1 packet transmitted, 1 received, 0% packet loss ---'
  open_cmd: 'open mailto:{email}'
  emails_label: 或写信至

footer:
  tagline: 由体素、咖啡和太多航班搭建而成
  prefs: 设置
  back_to_top: ▲ 回到出生点
  rights: 保留所有权利。
  updated: 更新于

prefs:
  open_label: 设置
  pause_label: 暂停动画
  title: '~/.config — prefs'
  heading: 设置
  intro: 更改即时生效，并且只保存在此浏览器中。
  close: 关闭
  reset_cmd: reset
  reset: 恢复默认设置
  theme:
    cmd: theme --set
    legend: 主题
    options:
      night: { name: 夜间, note: 默认 }
      day: { name: 白天, note: 主世界 }
      mono-dark: { name: 黑白深色, note: 基岩 }
      mono-light: { name: 黑白浅色, note: 纸张 }
      cvd: { name: 色盲友好, note: 棱镜 }
      auto: { name: 自动, note: '夜间或白天，跟随设备' }
    contrast_note: 你的设备要求更高的对比度，所以每个主题都使用更醒目的线条和文字。
  motion:
    cmd: motion --set
    legend: 动效
    options:
      auto: { name: 自动, note: 跟随设备 }
      full: { name: 完整, note: 一切都会动 }
      calm: { name: 平静, note: '没有开场和火花，循环放慢' }
      off: { name: 关闭, note: 一切静止 }
    reduced_note: 你的设备要求减少动态效果，所以无论选择什么，页面都保持静止。
  text:
    cmd: text --size
    legend: 文字大小
    option: '{size}%'
  keys:
    cmd: keys --shortcuts
    legend: 键盘快捷键
    on: 开
    off: 关
    note: '不在输入框里打字时，按“,”打开此窗口，按“p”暂停动画。'
  lang:
    cmd: lang --set
    legend: 语言
    note: 每种语言都是单独的页面；点击链接后仍停留在当前位置。
    draft: 草稿

