# 界面文字（简体中文）：copy.yaml 的每一个键都在这里，一个不少（少一个，构建就会失败）。
# 说明见 copy.yaml 与 content/README.md「翻译」一节。{占位符} 的用法与 copy.yaml 相同。
# 终端命令（whoami、git log …）、ping 的输出和 Clock Stamp 手机上的画面保持英文：
# 它们是代码或 App 本身的样子。
