    home_zone: America/Los_Angeles
    cities:
      - { code: FRA, name: Frankfurt, time_zone: Europe/Berlin }
      - { code: SEA, name: Seattle, time_zone: America/Los_Angeles }
      - { code: SHA, name: Shanghai, time_zone: Asia/Shanghai }
