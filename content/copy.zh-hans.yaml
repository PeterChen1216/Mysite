  eyebrow_prefix: '// 玩家:'
  globe_label: 地球
  globe_value: '已转动 {deg}°'
  globe_lat: { n: '北纬 {deg}°', s: '南纬 {deg}°' }
  globe_lon: { e: '东经 {deg}°', w: '西经 {deg}°' }
  globe_regions:
