# Interface text: section headings, prompts and button labels, taken from the Figma design.
# No facts about Peter live here — those come from the other content files and are filled in
# by the page (GPA, dates, roles, emails…). Edit any line freely.
# In `headline`, [brackets] mark the highlighted (green) word.
# {placeholders} work in every line and are filled in from your content:
#   {first} = first name, {host} = first name in lower case, {city} = first part of the profile
#   location, {email} = primary email, {domain} = site domain, {major} {department} {school}
#   {short} = education fields (a missing one falls back to degree / school).
# Symbols at the start or end of a link label (▲ ↓ ★) are hidden from screen readers.

nav:
  links:
    - { label: '~/about', href: '#about' }
    - { label: '~/projects', href: '#projects' }
    - { label: '~/experience', href: '#experience' }
    - { label: '~/contact', href: '#contact' }
  status: online · {city}
  resume: RESUME
  say_hi: SAY HI
  # Read out by screen readers only.
  logo_label: '{domain} — back to top'
  sections_label: Sections

hero:
  headline:
    - Crafting [data]
    - into things
    - people love[_]
  terminal_title: '{host}@{domain}: ~ — zsh'
  cmd_whoami: whoami
  cmd_interests: cat ~/interests.txt
  ok: '[OK]'
  summon: '/summon pixel_globe ~ ~ ~ {rotate:1b}'
  # The answer to /summon, ending with your status from profile.yaml ({status}).
  summon_ok: 'Summoned PixelGlobe. Chunks loaded: 36/36. {status}.'
  # The whoami line: {name} = full name, {programme} = major · track, {year} = ’27.
  whoami_line: '{name} — {programme} @ {school}, class of {year}.'
  cta_projects: SEE PROJECTS
  cta_resume: DOWNLOAD RESUME
  eyebrow_prefix: '// player:' # "// player: Peter Chen · UW iSchool ’27 · Seattle, Washington"
  # The hero globe is a slider for the keyboard: arrow keys turn it. Read out by screen readers;
  # {deg} is how far it has been turned.
  globe_label: Globe
  globe_value: 'turned {deg}°'
  # Under the pointer (or, from the keyboard, at its centre) the globe shows where that is: a
  # latitude, a longitude ({deg}: whole degrees) and the continent or ocean (read from the globe's
  # own map). Decoration: screen readers have the slider's value above.
  globe_lat: { n: '{deg}°N', s: '{deg}°S' }
  globe_lon: { e: '{deg}°E', w: '{deg}°W' }
  globe_regions:
    north_america: North America
    south_america: South America
    europe: Europe
    africa: Africa
    asia: Asia
    oceania: Oceania
    antarctica: Antarctica
    pacific: Pacific Ocean
    atlantic: Atlantic Ocean
    indian: Indian Ocean
    arctic: Arctic Ocean
    southern: Southern Ocean
  # The player card's name tag: a key that copies the GitHub handle ({handle}).
  copy_handle: copy # the key's word
  copy_label: 'Copy {handle}' # read out by screen readers
  copied: copied # after a copy (also read out)
  # The hero terminal's last line, `$ █`, is a real prompt (an easter egg): click it, or Tab to it
  # and press Enter. Commands stay in English; what they print comes from here and from your
  # content ({cmd} and {name} are filled in as it runs).
  prompt:
    open: Type a command in the terminal # the line's name (read out)
    label: Command # the text field's name (read out)
    hint: 'Type help for the commands. Esc closes.'
    help:
      - 'help — this list'
      - 'whoami — who I am'
      - 'ls — the sections of this page'
      - 'cat interests.txt — what I am into'
      - 'open resume — download my résumé'
      - 'theme night | day | mono | paper | prism — change the theme'
      - 'clear — clear the screen'
      - 'exit — close the prompt'
    not_found: 'command not found: {cmd} — try help'
    theme_set: 'theme: {name}'
    opening: 'opening {name}…'
  avgeek_badge: AvGeek  ✈  routes · seats · mileage
  # Replaces avgeek_badge once aviation.yaml `watching` has a route ({from}/{to}: its airports).
  avgeek_route: AvGeek  ✈  {from} ⇄ {to}

# The scrolling band under the hero. Platform and interest tags come from your content.
ticker:
  label: Status # read out by screen readers only
  tags: { xp: XP, now: NOW, work: WORK, ping: PING, edu: EDU }

about:
  cmd: cat ~/about.md
  title: ['Player stats &', 'loaded chunks']
  blurb: Who I am, what I’m studying, and what I get up to when I’m not shipping something. All stats self-reported, no cheats.
  whoami_title: Hi, I’m {first} — {major} at the {department}.
  card_whoami: whoami
  card_gpa: gpa --level
  card_now: now --building
  card_education: education
  card_off: off --the-clock
  card_avgeek: avgeek
  card_skills: inventory --skills
  # The tooltip over a skill or a course under the pointer or keyboard focus: its group, where it
  # is in the group and how many there are ({group} {n} {count}).
  slot_tip: '{group} · {n} of {count}'
  avgeek_title: Routes, seats, mileage plans.
  now_link: Open in the App Store
  skills_basic: basic # "…; basic Java"
  # Small labels around facts on the About cards (the facts themselves come from the other files).
  gpa_out_of: out of # "out of 4.00 · Cumulative GPA"
  track_suffix: track # "Data Science track"
  minor_prefix: Minor in # "Minor in …"
  coursework: Relevant coursework
  # Headings of the AvGeek panels; a panel only appears when aviation.yaml has entries for it.
  avgeek_panels:
    watching: Watching
    seat_rules: Seat rules
    favorite_cabins: Favorite cabins
    news: Route news
    fare_examples: Fare lab
    tools: Tools I use

projects:
  cmd: ls ~/projects --sort=shipping
  title: ['Builds, shipped', '& in progress']
  blurb: Things I’ve made or am making. Featured build first, then the rest of the inventory.
  featured: ★ FEATURED
  stack_label: 'Stack:'
  # The featured build's status terminal: window title (the project's file name is appended,
  # e.g. ~/projects/clock-stamp) and the command shown on its first line.
  status_title: '~/projects'
  status_cmd: git status
  # Link labels. A link listed under `links: other:` in a project file keeps its own label.
  link_appstore: App Store
  link_repo: Source code
  link_live: Live site
  next_label: next --chunk
  next_title: '??? (loading…)'
  next_body: Chunk not yet generated — check back after a few more commits.
  # Chips on the "next chunk" card; leave the list empty ([]) for none.
  next_tags: [TBD]
  next_progress: generating chunk (-1, 3)…
  # The phone beside a project with `demo: world-clock` (Clock Stamp), drawn after the app's clock
  # face and hidden from screen readers. It runs on the real time. Each city is a mark on the
  # 24-hour dial, labelled with its `code` (or its name when it has none). `home_zone` is "here":
  # the status-bar clock and what "+9h" counts from; a city in that zone gets the arrow hand.
  # The first city outside the home zone is the selected one (name, big clock, date).
  # 1–4 cities, IANA time zone names.
  phone:
    home_zone: America/Los_Angeles
    cities:
      - { code: FRA, name: Frankfurt, time_zone: Europe/Berlin }
      - { code: SEA, name: Seattle, time_zone: America/Los_Angeles }
      - { code: SHA, name: Shanghai, time_zone: Asia/Shanghai }
    weather: Open-Meteo
    # The hands are keys: point at one, tap it or Tab to it, and its city is shown. Read out
    # before the city names.
    pick_label: Show the time in
    hours: 24h
    tab_list: List
    tab_clock: Clock

experience:
  cmd: git log --oneline --graph ~/career
  title: [Commit history]
  blurb: Where I’ve been, newest first. HEAD points at whatever comes next.
  head_hint: say hi ↓
  head_dates: now →
  # What a commit's hash becomes under the pointer or focus ({hash}).
  show_cmd: 'git show {hash}'
  # The smaller log below the commit history: entries with `kind: volunteer` in experience.yaml.
  community_cmd: git log --oneline ~/community
  community_title: Community

contact:
  cmd: ping {host} --count 1
  title: ['Let’s craft', 'something.']
  say_hi: SAY HI · EMAIL
  github: GITHUB
  linkedin: LINKEDIN
  resume: RESUME.PDF
  # Title bar of the ping terminal, and the words before the list of public email addresses.
  terminal_title: '~/contact — zsh'
  ping:
    request: 'PING {host} ({email}): 56 data bytes'
    reply: '64 bytes from {email}: icmp_seq=0 ttl=64 time=0.27 ms'
    summary: '--- 1 packet transmitted, 1 received, 0% packet loss ---'
  open_cmd: 'open mailto:{email}'
  emails_label: or write to

footer:
  tagline: built with voxels, coffee & too many flights
  prefs: prefs # opens the settings window
  back_to_top: ▲ back to spawn
  rights: All rights reserved.
  updated: updated

# The settings window (~/.config) and the keys in the nav that open it and pause the page.
# The `cmd` lines are decoration; the `legend` and `name` lines are what screen readers read.
# Each choice applies at once and is saved in the visitor's browser only.
prefs:
  open_label: Settings # the gear key in the nav (read out by screen readers)
  pause_label: Pause animations # the pause key in the nav: pressed = paused
  title: '~/.config — prefs' # the window's title bar
  heading: Settings # the window's name (read out)
  intro: Changes apply at once and are saved in this browser only.
  close: close
  reset_cmd: reset
  reset: Reset to defaults
  theme:
    cmd: theme --set
    legend: Theme
    # One per theme: a plain name, and its in-world name (or a short note) under it.
    options:
      night: { name: Night, note: the default }
      day: { name: Day, note: Overworld }
      mono-dark: { name: Mono dark, note: Bedrock }
      mono-light: { name: Mono light, note: Paper }
      cvd: { name: Colour-blind safe, note: Prism }
      auto: { name: Auto, note: 'Night or Day, like your device' }
    contrast_note: Your device asks for more contrast, so every theme uses stronger lines and text.
  motion:
    cmd: motion --set
    legend: Motion
    options:
      auto: { name: Auto, note: like your device }
      full: { name: Full, note: everything moves }
      calm: { name: Calm, note: 'no intro or sparks, slower loops' }
      off: { name: 'Off', note: nothing moves }
    reduced_note: Your device asks for reduced motion, so the page stays still whatever you pick.
  text:
    cmd: text --size
    legend: Text size
    option: '{size}%' # {size} = 100, 115 or 130
  keys:
    cmd: keys --shortcuts
    legend: Keyboard shortcuts
    on: 'On'
    off: 'Off'
    note: '“,” opens this window and “p” pauses animations, when you are not typing in a field.'
  # The languages, each named in its own language (i18n.name in its copy file).
  lang:
    cmd: lang --set
    legend: Language
    note: Each language is its own page; the link keeps your place.
    draft: draft # after a language that is still a preview (only listed on preview pages)

# Small words used inside dates and lists.
labels:
  now: now # end of an ongoing entry in the commit history
  present: Present # end of an ongoing project on its card ("Mar 2026 – Present")
  expected: (expected) # graduation date not reached yet
  gpa: GPA # on the hero badge ("GPA 3.84 ★ …")
  # Dates: month names, and how a month and year are written ({month} {year} → "Mar 2027").
  months: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
  year_month: '{month} {year}'
  list_separator: ', ' # between the items of a list ("Python, R, SQL")
  # Platform words (projects/*.md `platform`).
  platform: { ios: iOS, web: Web, cli: CLI, research: Research }
  # Project status words (projects/*.md `status`), shown on the cards, badge and ticker.
  status:
    idea: idea
    wip: in progress
    testflight: TestFlight
    shipped: shipped
    completed: completed
    archived: archived
  new_tab: (opens in a new tab) # read out by screen readers only
  skip_link: Skip to content # first thing a keyboard user reaches

# Languages (PLAN-EXPERIENCE §5). Every copy file has this block, in its own language.
i18n:
  name: English # this language's own name, as the language switch lists it on every page
  # The notice on every page of a language that is still a preview (site.yaml `locales`).
  preview_notice: Draft translation, not yet reviewed.
  preview_link: Read the English version
  # The one-line suggestion on a first visit to a page in another language, when the browser
  # prefers this one. Written in this language: it is meant for the reader who reads it.
  suggest: This page is also in English.
  suggest_go: Read it in English
  suggest_dismiss: No thanks
  suggest_label: Language suggestion # read out by screen readers only

# The WebGL scene behind the page (PLAN-EXPERIENCE §7). It is decorative and says nothing, so this
# is only the developer line shown with ?debug=1 in the address: frames per second, milliseconds
# per frame, the graphics tier and why, draw calls and pixel ratio, filled in by the browser.
scene:
  hud: 'fps {fps} · {ms} ms · tier {tier} ({reason}) · {draws} draws · dpr {dpr}'
