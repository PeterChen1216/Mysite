# PLAN §9.1 automated checks. Runs on every push and on PRs into main.
# Content placeholders (TODO:/lorem/placeholder) are warnings on branches and errors for main.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · types · content · unit · build · size · e2e · a11y
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # "last updated" comes from git history of content/

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Colour tokens (no colour outside src/styles/tokens.css)
        run: pnpm lint:colors

      - name: Type check (astro check)
        run: pnpm check

      - name: Content guard
        run: pnpm content:check

      - name: Unit tests (+ coverage ≥ 80 %)
        run: pnpm test

      - name: Build (fails on any warning)
        run: pnpm build

      - name: Size budgets
        run: pnpm size

      - name: Assemble Pages artifact
        run: pnpm assemble

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E + axe (Chromium, mobile Chromium, WebKit)
        run: pnpm test:e2e

      - name: Upload site preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: _site
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.sha }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  launch:
    name: launch configuration · Lighthouse + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build, assemble and test exactly what flipping `launched: true` would deploy.
      SITE_STAGE: launched
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (launch configuration, base /)
        run: pnpm build

      - name: Lighthouse CI (perf/a11y/best-practices/SEO ≥ 95)
        run: pnpm lhci

      - name: Assemble Pages artifact (launched)
        run: pnpm assemble

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (launched layout)
        run: pnpm test:e2e --project=chromium

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.sha }}
          path: .lighthouseci
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true # .lighthouseci starts with a dot
