# PLAN §9.1 automated checks. Runs on every push and on PRs into main.
# Content placeholders (TODO:/lorem/placeholder) are warnings on branches and errors for main.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · types · content · unit · build · size · e2e · a11y
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # "last updated" comes from git history of content/

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Colour tokens (no colour outside src/styles/tokens.css)
        run: pnpm lint:colors

      - name: Type check (astro check)
        run: pnpm check

      - name: Content guard
        run: pnpm content:check

      # PLAN-EXPERIENCE §5.4: translations whose English (or Simplified) source changed since they
      # were made. A report for the owner; it never fails the run.
      - name: Translation staleness report
        run: pnpm content:stale

      - name: Unit tests (+ coverage ≥ 80 %)
        run: pnpm test

      # PLAN §7.4: CHANGELOG.md is written from the history after each deploy of main
      # (deploy.yml); here it is only written to a scratch file, to prove the script still works.
      - name: CHANGELOG from the history (written for real after each deploy)
        run: |
          node scripts/changelog.mjs --out "$RUNNER_TEMP/CHANGELOG.md"
          head -n 30 "$RUNNER_TEMP/CHANGELOG.md"

      - name: Build (fails on any warning)
        run: pnpm build

      - name: Size budgets
        run: pnpm size

      - name: Assemble Pages artifact
        run: pnpm assemble

      # PLAN §7.2 path 2, "see it before it is public": GitHub Pages hosts one site per repository,
      # so a branch or pull request gets its built site as a download, not an address of its own
      # (docs/PLAN.md §13 ADR-021). Uploaded before the long E2E step: ready a few minutes in.
      - name: Upload site preview
        id: preview
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: _site
          retention-days: 7
          if-no-files-found: ignore

      - name: Preview link (shown on this run's summary page)
        if: steps.preview.outputs.artifact-url != ''
        env:
          URL: ${{ steps.preview.outputs.artifact-url }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Preview this commit's site"
            echo ""
            echo "1. Download **[site-${SHA}](${URL})** — a zip, kept 7 days (you need to be signed in to GitHub)."
            echo "2. Unzip it (on a Mac: double-click it in Downloads)."
            echo "3. In your clone of the repository run \`pnpm preview:site ~/Downloads/site-${SHA}\`, then open the address it prints."
            echo ""
            echo "Step by step, with what you will see: docs/CONTENT-GUIDE.md, section 12."
          } >> "$GITHUB_STEP_SUMMARY"

      # The browsers are cached by the lockfile (Playwright's version): a slow download once took
      # most of the job's time (M2, M3); the system packages still come from apt each run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E + axe (Chromium, mobile Chromium, WebKit)
        run: pnpm test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.sha }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  launch:
    name: launch configuration · Lighthouse + E2E
    runs-on: ubuntu-latest
    # M3 added the directory, a project page and the 404 to Lighthouse in every locale (10 pages ×
    # 5 runs, about 10 minutes): 20 minutes left no room for a slow runner.
    timeout-minutes: 30
    env:
      # Build, assemble and test exactly what flipping `launched: true` would deploy.
      SITE_STAGE: launched
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (launch configuration, base /)
        run: pnpm build

      - name: Lighthouse CI (perf/a11y/best-practices/SEO ≥ 95)
        run: pnpm lhci

      - name: Assemble Pages artifact (launched)
        run: pnpm assemble

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (launched layout)
        run: pnpm test:e2e --project=chromium

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.sha }}
          path: .lighthouseci
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true # .lighthouseci starts with a dot
