# Deploy to GitHub Pages (PLAN §11). Requires: Settings → Pages → Source = "GitHub Actions".
# Before launch (content/site.yaml `launched: false`) the old site stays at https://zhic.me/
# and v2 is previewed at https://zhic.me/v2/ — see scripts/assemble-pages.mjs.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Content guard (strict)
        run: pnpm content:check --strict

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Assemble Pages artifact
        run: pnpm assemble

      # Smoke-test the exact artifact before it replaces the live site.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke test (Chromium)
        run: pnpm test:e2e --project=chromium

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # PLAN §7.4: CHANGELOG.md is written from the commit history after every deploy — never by hand.
  # A commit made with this workflow's token starts no other workflow (no CI run, no deploy loop).
  # If main moved on meanwhile, it rebases and tries again; the next deploy rewrites the file anyway.
  changelog:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # This job runs one script and installs nothing. setup-node v5 turns its package-manager
      # cache on when package.json names one, then looks for pnpm, which this job never installs:
      # the first real deploy failed here ("Unable to locate executable file: pnpm").
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Write CHANGELOG.md from the history
        run: node scripts/changelog.mjs

      - name: Commit it if it changed
        run: |
          if git diff --quiet -- CHANGELOG.md && git ls-files --error-unmatch CHANGELOG.md >/dev/null 2>&1; then
            echo "CHANGELOG.md is up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'chore(changelog): update CHANGELOG.md [skip ci]'
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
