# Deploy to GitHub Pages (PLAN §11). Requires: Settings → Pages → Source = "GitHub Actions".
# Before launch (content/site.yaml `launched: false`) the old site stays at https://zhic.me/
# and v2 is previewed at https://zhic.me/v2/ — see scripts/assemble-pages.mjs.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Content guard (strict)
        run: pnpm content:check --strict

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Assemble Pages artifact
        run: pnpm assemble

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
